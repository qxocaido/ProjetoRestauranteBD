<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Editar Ingrediente</title>
</head>

<body>

<h1>Editar Ingrediente</h1>

<form id="formIngrediente">

    <label>Nome</label><br>
    <input type="text" id="nome">

    <br><br>

    <label>Valor</label><br>
    <input type="number" step="0.01" id="valor">

    <br><br>

    <label>Disponibilidade</label><br>

    <select id="disponibilidade">

        <option value="true">Disponível</option>

        <option value="false">Indisponível</option>

    </select>

    <br><br>

    <label>Fornecedor</label><br>

    <select id="fornecedor">

    </select>

    <br><br>

    <button type="submit">

        Salvar Alterações

    </button>

</form>

<script src="editarIngredientes.js"></script>

</body>
</html>
