<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Cadastrar Fornecedor</title>
</head>
<body>

    <h1>Cadastrar Fornecedor</h1>

    <form>

        <label>Nome:</label><br>
        <input type="text" id="nome"><br><br>

        <label>CNPJ:</label><br>
        <input type="number" id="cnpj"><br><br>

        <label>Telefone:</label><br>
        <input type="text" id="telefone"><br><br>


        <button type="submit">
            Cadastrar
        </button>

    </form>

</body>
</html>

<script src="cadastrarFornecedor.js"></script>
